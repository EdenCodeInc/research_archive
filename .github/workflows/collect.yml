name: Collect and publish

on:
  schedule:
    # 06:15 UTC daily. Off the hour because scheduled runs cluster on the hour
    # and GitHub delays them under load.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to collect"
        required: false
        default: "7"
      skip_summaries:
        description: "Skip Claude summarization (no API cost)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs write to data/entries.json at once.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, summarize, and render
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # Used only for absolute links in the RSS feed. Override with a
          # SITE_URL repository variable if you serve from a custom domain.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          python -m collector.main \
            --days "${{ github.event.inputs.days || '7' }}" \
            ${{ github.event.inputs.skip_summaries == 'true' && '--no-summarize' || '' }}

      - name: Commit new entries
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json
          if git diff --staged --quiet; then
            echo "No new entries."
          else
            git commit -m "Add entries collected $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
